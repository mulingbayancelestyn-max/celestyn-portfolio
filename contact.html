<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <header>
        <nav>
            <h2 class="logo">Celestyn.</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-section">
        <h1 class="section-title">Contact Me</h1>
        <p class="intro">
            Feel free to send me a message or get in touch.
        </p>

        <div class="contact-box">
            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" rows="6" placeholder="Write your message here..." required></textarea>

                <button type="submit" class="btn">Send Message</button>
            </form>

            <div class="contact-info">
                <p><strong>Email:</strong> yourname@email.com</p>
                <p><strong>Website:</strong> My Personal Portfolio</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Celestyn | My Personal Portfolio</p>
    </footer>

</body>
</html>
